<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#3E5F7F"><title>Start Free — Structevo AI</title><link rel="stylesheet" href="styles.css"></head><body class="auth-body">
<header class="navbar"><div class="container nav-inner"><a class="brand" href="index.html"><img class="brandmark-img" src="structevo-logo.png" alt="Structevo logo">STRUCTEVO AI</a><div class="nav-actions"><a class="btn" href="login.html">Log in</a></div></div></header>
<main class="auth-shell"><section class="auth-card auth-card-wide"><div class="auth-logo"><img src="structevo-logo.png" alt="Structevo"></div><span class="badge">START FREE</span><h1>Create your workspace.</h1><p>Start with the Free plan. No card required.</p><form id="signupForm" class="auth-form"><div class="auth-grid"><label>Full name<input id="signupName" type="text" autocomplete="name" placeholder="Your name" required></label><label>Email<input id="signupEmail" type="email" autocomplete="email" placeholder="you@example.com" required></label></div><div class="auth-grid"><label>Password<input id="signupPassword" type="password" autocomplete="new-password" placeholder="At least 8 characters" required></label><label>Confirm password<input id="signupConfirm" type="password" autocomplete="new-password" placeholder="Repeat password" required></label></div><label class="auth-check"><input type="checkbox" required><span>I agree to the Terms and Privacy Policy.</span></label><div id="authMessage" class="auth-message" hidden></div><button class="btn dark auth-submit" type="submit">Create Free Account</button></form><p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p><p class="auth-footnote">Prototype account access is stored only in this browser. Secure cloud authentication will be connected before public launch.</p></section></main>
<script src="auth.js"></script></body></html>
